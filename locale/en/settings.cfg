hps__lse-elevator_clearance_name=Clearance station name

[mod-setting-description]
hps__lse-debug-mode=Enables debugging information.
hps__lse-use_elevator_clearance=Trains that leave an elevator and head directly for a destination with a remaining train limit of 1 will stutter and produce the message "[color=purple]Destination full[/color]." To avoid this, the train can head for a clearance station first.\nSuch a station must [color=cyan]not have a train limit[/color] and must be at least [color=cyan]a full train length away[/color] from the point of egress within the elevator.\n\nThis setting adds such stations to every LTN delivery that runs through an elevator. The next setting defines the name of all these stations.\n\nSince LTN requesters and providers rarely have Factorio train limits, enabling this feature is mostly useful with train-limited depots.
